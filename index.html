<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inspirerende Quotes</title>
<style>
  :root{
    --bg:#0a0a0f; --card:#14141f; --ink:#f4f4f8; --dim:#8b8ba0;
    --accent:#c9a227; --accent2:#7c5cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(124,92,255,.22), transparent 60%),
      radial-gradient(800px 500px at 95% 110%, rgba(201,162,39,.16), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:880px;text-align:center}
  .kicker{
    font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:26px;
  }
  .quote-box{
    min-height:280px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    transition:opacity .3s ease, transform .3s ease;
  }
  .quote-box.fade{opacity:0;transform:translateY(10px)}
  .mark{font-size:4rem;line-height:0;color:var(--accent2);opacity:.55;margin-bottom:26px}
  #quote{
    font-size:clamp(1.5rem,4.2vw,2.8rem);
    line-height:1.28;font-weight:600;letter-spacing:-.02em;
    text-wrap:balance;
  }
  #author{
    margin-top:26px;font-size:1rem;color:var(--dim);
    letter-spacing:.06em;text-transform:uppercase;font-weight:500;
  }
  #author:before{content:"— "}
  .meta{margin-top:14px;font-size:.8rem;color:#4d4d63;letter-spacing:.05em}

  .controls{
    display:flex;gap:12px;justify-content:center;flex-wrap:wrap;
    margin-top:38px;
  }
  button,select{
    padding:14px 28px;border:none;border-radius:999px;
    font-size:.95rem;font-weight:600;letter-spacing:.02em;
    cursor:pointer;font-family:inherit;
    transition:transform .15s ease, box-shadow .25s ease, filter .2s ease;
  }
  button{
    background:linear-gradient(135deg,var(--accent2),#a78bfa);
    color:#fff;box-shadow:0 8px 30px rgba(124,92,255,.35);
  }
  button.ghost{
    background:rgba(255,255,255,.07);color:var(--ink);
    box-shadow:none;border:1px solid rgba(255,255,255,.12);
  }
  button:hover{transform:translateY(-2px);box-shadow:0 12px 38px rgba(124,92,255,.42)}
  button.ghost:hover{background:rgba(255,255,255,.12);box-shadow:0 8px 24px rgba(0,0,0,.3)}
  button:active{transform:translateY(0) scale(.98)}
  button:disabled{filter:grayscale(.5) brightness(.7);cursor:wait;transform:none}
  button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

  select{
    background:var(--card);color:var(--ink);
    border:1px solid rgba(255,255,255,.12);
    max-width:280px;
  }
  .counter{
    margin-top:30px;font-size:.82rem;color:var(--dim);
  }
  .counter b{color:var(--accent);font-weight:700}
  footer{margin-top:26px;font-size:.76rem;color:#3c3c50;line-height:1.7}
  footer span{color:var(--dim)}
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Daily Inspiration</p>

  <div class="quote-box" id="box">
    <div class="mark">&ldquo;</div>
    <p id="quote">Laden&hellip;</p>
    <p id="author"></p>
    <p class="meta" id="meta"></p>
  </div>

  <div class="controls">
    <button class="ghost" id="prev" type="button">&larr; Vorige</button>
    <button id="random" type="button">Willekeurig</button>
    <button class="ghost" id="next" type="button">Volgende &rarr;</button>
  </div>

  <div class="controls">
    <select id="authorFilter" aria-label="Filter op auteur">
      <option value="">Alle auteurs</option>
    </select>
  </div>

  <p class="counter">Database: <b id="count">&mdash;</b> quotes &middot; <b id="acount">&mdash;</b> auteurs</p>

  <footer>Gebouwd met <span>Gemini</span> &middot; gehost op <span>Railway</span><br>
  <span id="indexlabel"></span></footer>
</main>

<script>
(function () {
  var box = document.getElementById('box');
  var quoteEl = document.getElementById('quote');
  var authorEl = document.getElementById('author');
  var metaEl = document.getElementById('meta');
  var countEl = document.getElementById('count');
  var acountEl = document.getElementById('acount');
  var indexLabel = document.getElementById('indexlabel');
  var filterEl = document.getElementById('authorFilter');
  var btnPrev = document.getElementById('prev');
  var btnNext = document.getElementById('next');
  var btnRandom = document.getElementById('random');

  var state = { index: 0, total: 0, author: '', busy: false };

  function lock(on) {
    state.busy = on;
    btnPrev.disabled = on;
    btnNext.disabled = on;
    btnRandom.disabled = on;
  }

  function show(data) {
    quoteEl.textContent = data.text;
    authorEl.textContent = data.author;
    state.index = data.index;
    state.total = data.total;
    metaEl.textContent = data.pool < data.total
      ? 'gefilterd: ' + data.pool + ' quotes van ' + data.author
      : '';
    indexLabel.textContent = 'quote ' + (data.index + 1) + ' / ' + data.pool;
    box.classList.remove('fade');
  }

  function load(params) {
    if (state.busy) { return; }
    lock(true);
    box.classList.add('fade');

    var qs = new URLSearchParams(params || {});
    if (state.author && !qs.has('author')) { qs.set('author', state.author); }

    fetch('/api/quote?' + qs.toString(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        setTimeout(function () { show(data); lock(false); }, 260);
      })
      .catch(function () {
        quoteEl.textContent = 'Kon geen quote laden.';
        authorEl.textContent = '';
        metaEl.textContent = '';
        box.classList.remove('fade');
        lock(false);
      });
  }

  function step(delta) {
    var total = state.total || 1;
    var next = (state.index + delta + total) % total;
    load({ i: next });
  }

  btnPrev.addEventListener('click', function () { step(-1); });
  btnNext.addEventListener('click', function () { step(1); });
  btnRandom.addEventListener('click', function () { load({}); });

  filterEl.addEventListener('change', function () {
    state.author = filterEl.value;
    load({});
  });

  document.addEventListener('keydown', function (e) {
    if (e.target === filterEl) { return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); load({}); }
  });

  fetch('/api/health', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      countEl.textContent = d.quotes;
      acountEl.textContent = d.authors;
    })
    .catch(function () {});

  fetch('/api/authors', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var top = d.authors.slice(0, 120);
      top.forEach(function (a) {
        var opt = document.createElement('option');
        opt.value = a.name;
        opt.textContent = a.name + ' (' + a.count + ')';
        filterEl.appendChild(opt);
      });
    })
    .catch(function () {});

  load({ i: 0 });
})();
</script>
</body>
</html>
